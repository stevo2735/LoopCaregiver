name: 2. Add Identifiers
run-name: Add Identifiers (${{ github.ref_name }})
on:
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  identifiers:
    name: Add Identifiers
    needs: validate
    runs-on: macos-15
    steps:
      # Checks-out the repo
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      # Install patched fastlane for capability relationship fix
      - name: Install Patched Fastlane for Capability Fix
        run: |
          echo "Current fastlane version:"
          fastlane --version
          echo "Installing patched fastlane for capability fix..."
          # Install git-based gem installer
          sudo gem install specific_install --no-document
          # Remove existing fastlane
          sudo gem uninstall fastlane --all --force || true
          # Install the patched version from PR #29596
          sudo gem specific_install https://github.com/hugomarisco/fastlane.git --branch=patch-2
          echo "Patched fastlane version:"
          fastlane --version
        
      # Patch Fastlane Match to not print tables
      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d"

      # Sync the GitHub runner clock with the Windows time server (workaround as suggested in https://github.com/actions/runner/issues/2996)
      - name: Sync clock
        run: sudo sntp -sS time.windows.com
        
      # Create or update identifier for LoopCaregiver
      - name: Fastlane Provision Caregiver
        run: fastlane caregiver_identifier
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
